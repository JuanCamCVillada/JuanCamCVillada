<svg width="900" height="480" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'SFMono-Regular', 'Menlo', 'Consolas', monospace; }
    </style>
    <clipPath id="stripeClip">
      <rect x="640" y="0" width="260" height="480"/>
    </clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- fondo -->
  <rect width="900" height="480" fill="#111827"/>

  <!-- panel de lineas diagonales (referencia al poster) -->
  <g clip-path="url(#stripeClip)">
    <rect x="640" y="0" width="260" height="480" fill="#0A0E14"/>
    <g stroke="#42A5F5" stroke-width="6">
      <line x1="600" y1="-40" x2="1160" y2="520"/>
      <line x1="580" y1="-40" x2="1140" y2="520"/>
      <line x1="560" y1="-40" x2="1120" y2="520"/>
      <line x1="540" y1="-40" x2="1100" y2="520"/>
    </g>
    <g stroke="#02569B" stroke-width="6">
      <line x1="520" y1="-40" x2="1080" y2="520"/>
      <line x1="500" y1="-40" x2="1060" y2="520"/>
      <line x1="480" y1="-40" x2="1040" y2="520"/>
      <line x1="460" y1="-40" x2="1020" y2="520"/>
    </g>
    <g stroke="#1E3A5F" stroke-width="6">
      <line x1="440" y1="-40" x2="1000" y2="520"/>
      <line x1="420" y1="-40" x2="980" y2="520"/>
      <line x1="400" y1="-40" x2="960" y2="520"/>
      <line x1="380" y1="-40" x2="940" y2="520"/>
      <line x1="360" y1="-40" x2="920" y2="520"/>
      <line x1="340" y1="-40" x2="900" y2="520"/>
    </g>
  </g>
  <rect x="640" y="0" width="1" height="480" fill="#42A5F5" opacity="0.5"/>

  <!-- linea vertical divisoria con texto rotado -->
  <g class="mono" fill="#8B98A8" font-size="10" letter-spacing="3">
    <text x="0" y="0" transform="translate(644,440) rotate(-90)">SYSTEM ONLINE · JUAN CAMILO C VILLADA · SYSTEM ONLINE</text>
  </g>

  <!-- marco angular -->
  <g stroke="#42A5F5" stroke-width="2" fill="none">
    <path d="M 20 50 L 20 20 L 50 20"/>
    <path d="M 850 20 L 880 20 L 880 50"/>
    <path d="M 20 440 L 20 470 L 50 470"/>
    <path d="M 880 440 L 880 470 L 850 470"/>
  </g>

  <text x="30" y="34" class="mono" font-size="11" fill="#8B98A8" letter-spacing="2">DOSSIER://DEVBYJUAN</text>
  <text x="590" y="34" class="mono" font-size="11" fill="#8B98A8" letter-spacing="1" text-anchor="end">N.01</text>

  <!-- kicker -->
  <text x="30" y="90" class="mono" font-size="12" fill="#42A5F5" letter-spacing="4">SYSTEMS ENGINEERING //</text>

  <!-- logo ascii grande -->
  <g class="mono" font-size="20" font-weight="bold" fill="#F9FEFD" letter-spacing="0.5" filter="url(#glow)">
    <text x="26" y="130" xml:space="preserve"> ___  _____   _______   __  _ _   _  _   _  _ </text>
    <text x="26" y="150" xml:space="preserve">|   \| __\ \ / / _ ) \ / / | | | | |/_\ | \| |</text>
    <text x="26" y="170" xml:space="preserve">| |) | _| \ V /| _ \\ V / || | |_| / _ \| .` |</text>
    <text x="26" y="190" xml:space="preserve">|___/|___| \_/ |___/ |_| \__/ \___/_/ \_\_|\_|</text>
  </g>

  <text x="30" y="222" class="mono" font-size="14" fill="#42A5F5" letter-spacing="1">Developer &amp; Creator — juanvillada.dev</text>

  <!-- divisor -->
  <line x1="30" y1="255" x2="580" y2="255" stroke="#1E3A5F" stroke-width="1"/>

  <!-- descripcion -->
  <text x="30" y="284" class="mono" font-size="14" font-weight="bold" fill="#42A5F5">Hey, soy Juan — developer &amp; creator.</text>
  <g class="mono" font-size="13" fill="#8B98A8">
    <text x="30" y="308">Creo que aprender a programar es menos sobre el código y más</text>
    <text x="30" y="328">sobre aprender a pensar. Autodidacta de cabeza a pies, cerrando</text>
    <text x="30" y="348">Ingeniería de Sistemas mientras construyo cosas de verdad: apps,</text>
    <text x="30" y="368">contenido, y el camino hacia algo más grande.</text>
  </g>
</svg>
